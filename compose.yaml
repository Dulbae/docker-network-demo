services:
  web:
    image: nginx:latest
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html

  mysql:
    image: mysql:8

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - mysql-data:/var/lib/mysql
  adminer:
     image: adminer
     ports:
      - "8081:8080"

volumes:
  mysql-data:


